<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday, Chemmy!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      color: #333;
      text-align: center;
    }

    .container {
      padding: 100px 20px;
    }

    h1 {
      font-size: 3em;
      color: #e91e63;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      font-size: 1.4em;
      margin-top: 30px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
      animation: fadeIn 3s ease-in-out;
    }

    .code-style {
      background-color: #222;
      color: #0f0;
      padding: 20px;
      margin-top: 40px;
      border-radius: 8px;
      font-family: monospace;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      animation: fadeIn 4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Happy Birthday Chaimae!</h1>
    <p>
      Wishing you health, success, and happiness ...<br>
      May your projects build without errors, and your dreams come true Incha'Allah.<br>
      Love you so much (:  <br>
      With love,<br>
      <strong>Your friend, Soukaina</strong>
    </p>
<br><br>
    <div class="code-style">
      <pre>
if (today === "yourBirthday") {
    smile();
    enjoy();
}
      </pre>
    </div>
  </div>
</body>
</html>
